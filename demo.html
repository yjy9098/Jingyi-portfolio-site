<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Reel - 个人作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bungee&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #000;
    }

    .demo-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      padding: 32px 20px;
      overflow: hidden;
    }

    .demo-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .demo-title {
      color: #ffd700;
      font-size: clamp(2.2rem, 3.6vw, 3.8rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-shadow: 0 0 32px rgba(255, 215, 0, 0.55);
      font-family: 'Bungee', sans-serif;
      margin: 0;
      text-align: center;
    }

    .video-container {
      width: 85vw;
      max-width: 85%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 223, 0, 0.3);
      box-shadow: 0 0 48px rgba(255, 223, 0, 0.25);
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="page-overlay"></div>
  <div class="custom-cursor"></div>
  <div class="demo-shell">
    <div class="demo-container">
      <h1 class="demo-title">Demo Reel</h1>
      <div class="video-container">
        <iframe src="https://player.vimeo.com/video/1196748584" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%; height:100%;"></iframe>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
